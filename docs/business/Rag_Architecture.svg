<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="fadedBlur">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="fadedBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="agent-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComponentTransfer in="blur" result="fadedBlur">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="fadedBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <linearGradient id="cyanDeepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <linearGradient id="cyanMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <text x="600" y="72" text-anchor="middle" font-size="32" font-weight="700" fill="#C2410C" letter-spacing="1">Forge &amp; Flow: How the Advisor Reasons</text>

  <ellipse cx="600" cy="170" rx="170" ry="42" fill="url(#orangeGrad)" stroke="#F97316" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="600" y="178" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Restaurant Operator</text>

  <path d="M 555 212 L 555 320" stroke="#F97316" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="540" y="275" text-anchor="end" font-size="14" fill="#C2410C" font-style="italic">Asks a Question</text>

  <path d="M 645 320 L 645 212" stroke="#F97316" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="660" y="275" text-anchor="start" font-size="14" fill="#C2410C" font-style="italic">Grounded Coaching</text>

  <rect x="320" y="320" width="560" height="160" rx="22" ry="22" fill="url(#orangeGrad)" stroke="#F97316" stroke-width="3" filter="url(#agent-glow)"/>
  <text x="600" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#FED7AA" letter-spacing="4">LAYER 3 AGENT</text>
  <text x="600" y="415" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">Claude</text>
  <text x="600" y="455" text-anchor="middle" font-size="18" fill="#FED7AA">Reasons Across Methodology + Live Data</text>

  <path d="M 420 480 Q 340 580 285 640" stroke="#0891B2" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-cyan)"/>
  <text x="265" y="570" text-anchor="end" font-size="14" fill="#155E75" font-style="italic">Graph Traversal</text>

  <path d="M 780 480 Q 860 580 915 640" stroke="#0891B2" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-cyan)"/>
  <text x="935" y="570" text-anchor="start" font-size="14" fill="#155E75" font-style="italic">Live Tool Call</text>

  <rect x="90" y="640" width="460" height="200" rx="20" ry="20" fill="url(#cyanDeepGrad)" stroke="#06B6D4" stroke-width="3" filter="url(#soft-shadow)"/>
  <text x="320" y="682" text-anchor="middle" font-size="14" font-weight="700" fill="#A5F3FC" letter-spacing="4">LAYER 1 KNOWLEDGE GRAPH</text>
  <text x="320" y="720" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Shared Methodology</text>
  <text x="320" y="755" text-anchor="middle" font-size="15" fill="#A5F3FC">Jim Taylor Labor Model</text>
  <text x="320" y="778" text-anchor="middle" font-size="15" fill="#A5F3FC">Vanessa's Restaurant SOPs and Training</text>
  <text x="320" y="801" text-anchor="middle" font-size="15" fill="#A5F3FC">Other Industry Standards</text>
  <text x="320" y="828" text-anchor="middle" font-size="13" fill="#67E8F9" font-style="italic">Shared Across All Operators</text>

  <rect x="650" y="640" width="460" height="200" rx="20" ry="20" fill="url(#cyanMidGrad)" stroke="#22D3EE" stroke-width="3" filter="url(#soft-shadow)"/>
  <text x="880" y="682" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e" letter-spacing="4">LAYER 2 LIVE TOOLS</text>
  <text x="880" y="720" text-anchor="middle" font-size="22" font-weight="700" fill="#0c4a6e">This Restaurant's Data</text>
  <text x="880" y="760" text-anchor="middle" font-size="15" fill="#155E75">CPLH, SPLH, Sales Labor %</text>
  <text x="880" y="785" text-anchor="middle" font-size="15" fill="#155E75">Headcount, Variance</text>
  <text x="880" y="828" text-anchor="middle" font-size="13" fill="#0c4a6e" font-style="italic">Isolated, Private, Never Shared</text>
</svg>

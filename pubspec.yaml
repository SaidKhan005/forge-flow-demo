name: forge_and_flow
description: "Forge & Flow - live labor productivity dashboard for restaurant floor managers."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+17

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  provider: ^6.1.2
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  shared_preferences: ^2.3.0
  meta: ^1.16.0
  # Phase 9.4 - SHA-256 hashing for recovery-code at-rest hashing.
  # Was previously dev-only (used by the corpus build tool); promoted
  # to a direct dependency so `lib/services/mfa/recovery_code_hasher.dart`
  # can use it. Same lock-file version, no toolchain change.
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  postgres: ^3.5.9
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_auth_web: ^6.1.5
  flutter_secure_storage: ^10.0.0
  timezone: ^0.10.1
  qr_flutter: 4.1.0
  # Phase 11A.4b — Gemini fallback LLM provider (server-side only,
  # used by the advisor proxy in tool/advisor_proxy/. The client app
  # never holds the key — see Hard Promise #7 in CLAUDE.md). Pure
  # Dart, no platform plugins.
  google_generative_ai: ^0.4.7
  # HTTP client for the Anthropic Messages API adapter
  # (tool/advisor_proxy/anthropic_http_complete_fn.dart). Server-side
  # only — same Hard Promise #7 boundary as the Gemini provider.
  # Promoted from transitive to direct so the proxy bootstrap can
  # take a stable dependency on it.
  http: ^1.6.0
  # Phase 10a.0 — realtime push channel client. Cross-platform
  # WebSocket abstraction so the realtime subscription works on
  # native (mobile/desktop) and web targets through a single API.
  # Used by `lib/services/realtime/realtime_subscription.dart`; the
  # proxy server-side WebSocket uses dart:io directly.
  web_socket_channel: ^3.0.1
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^20.1.0
  # MP1 — Crashlytics crash reporting (V1 launch blocker).
  firebase_crashlytics: ^5.2.0
  # MP2 — in-app update / version-compatibility check.
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.0
  # MP4 — iOS push denied recovery: open app settings.
  app_settings: ^5.1.1
  # MP5 — Universal Links / App Links deep link handling.
  app_links: ^6.3.4
  # MP6 — French (Quebec) localizations.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Pressure-preview Phase 4 — flutter integration_test driver for the
  # operator-facing emulator click-path under
  # `integration_test/phase_4_emulator/`. Demo-mode walkthrough only
  # (HP #2 + HP #10). Runs against a connected Android emulator; never
  # gates CI (CI is billing-blocked at the time of authoring).
  integration_test:
    sdk: flutter

  # Wave 2 Q-2b — Patrol native UI driver for the in-app notification
  # surface soak harness under `integration_test/in_app_notifications/`
  # and the driver at `tool/in_app_notification_soak/`. Test-only;
  # never ships in a release binary. Bumps `flutter_test`-shaped tests
  # with native gesture + push-notification hooks Patrol exposes that
  # the stock `WidgetTester` lacks (lockscreen-shade interaction,
  # cross-process FCM delivery). Pinned to a stable major; the
  # in-tree harness gates the actual on-device runs behind an env var
  # so a missing Android SDK / iOS toolchain does not break unrelated
  # `dart analyze` or `flutter test` invocations.
  patrol: ^4.5.0

  # Phase 10a.0 — virtualized clock for the realtime back-off /
  # poll-tick tests. Bundled transitively by flutter_test; promoted to
  # a direct dev dep so depend_on_referenced_packages stays clean.
  fake_async: ^1.3.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  yaml: ^3.1.3

  # Wave-2 lane G — engineering-bar metrics tooling.
  # `dart_code_linter` is the maintained successor to the discontinued
  # `dart_code_metrics` package (the upstream was discontinued ~2 years
  # ago in favor of the commercial DCM tool; Bancolombia forked the
  # last open-source release and maintain it as `dart_code_linter`,
  # latest 4.0.3 as of 2026-05). Backs the §5.2 engineering bars from
  # `docs/_audits/code_health/code_hardening_plan_2026_05_21.md`:
  # source-lines-of-code ≤ 80, cyclomatic-complexity ≤ 12,
  # maximum-nesting-level ≤ 5, number-of-parameters ≤ 7. Configured
  # advisory-only in `analysis_options.yaml` — does NOT fail `dart
  # analyze`. Runbook: `runbooks/dart_code_metrics_runbook.md`.
  dart_code_linter: ^4.0.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets_src/logo.png"
  adaptive_icon_background: "#3DCFCF"
  adaptive_icon_foreground: "assets_src/logo.png"

flutter_native_splash:
  # Match the in-app loading screen: centered Forge & Flow logo lockup.
  # This avoids the old Android icon-only splash and keeps cold starts branded.
  color: "#F8EDE6"
  image: "assets_src/forge_flow_splash_lockup.png"
  android_12:
    color: "#F8EDE6"
    image: "assets_src/forge_flow_splash_lockup.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    # Bundled Google Fonts (offline-correct first launch): the exact
    # Playfair Display / IBM Plex Sans / IBM Plex Mono static variants
    # the app requests, named per the google_fonts package's bundled
    # matching convention, plus each family's OFL license. Runtime
    # fetching is disabled in the app entrypoints.
    - google_fonts/
    - assets/internal/barrio/
    # Training content pictures (asset dirs are not recursive; one entry
    # per doc_id folder written by tool/barrio_training_image_extractor.py).
    - assets/internal/barrio/training/barrio_company_handbook/
    - assets/internal/barrio/training/barrio_interview_playbook/
    - assets/internal/barrio/training/barrio_legado_menu_concept_slides/
    - assets/internal/barrio/training/coffee_training/
    - assets/internal/barrio/training/food_safety_manual/
    - assets/internal/barrio/training/labour_cost_understanding_the_levers/
    - assets/internal/barrio/training/latin_american_dishes/
    - assets/internal/barrio/training/latin_american_ingredients/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

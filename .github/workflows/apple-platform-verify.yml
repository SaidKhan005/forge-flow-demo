name: Apple Platform Verification

# Cost discipline: macos-15 runners are billed at ~10× the Linux rate.
# Auto-running this workflow on every push/PR was the dominant Actions
# spend (3 macOS jobs × every commit). Gated to manual dispatch only.
# Trigger from the Actions tab before merging anything that touches:
#   - ios/** or macos/**
#   - Firebase plists (ios/Runner/Firebase/GoogleService-Info-*.plist)
#   - test/auth_session_test.dart, test/mfa_test.dart,
#     test/proxy_mfa_operations_gateway_test.dart
#   - any Apple-platform-specific Flutter code path
on:
  workflow_dispatch:

jobs:
  macos-host-tests:
    name: macOS host tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          flutter --version

      - name: Focused auth and MFA tests
        run: >
          flutter test
          test/auth_session_test.dart
          test/mfa_test.dart
          test/proxy_mfa_operations_gateway_test.dart

      - name: macOS project status
        run: |
          if [ -d macos ]; then
            flutter build macos --debug
          else
            echo "::notice::No Flutter macOS app project is tracked; macOS verification is limited to host/toolchain tests."
          fi

  ios-simulator-build:
    name: iOS simulator build (${{ matrix.flavor }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: ForgeFlow
            target: lib/main_forgeflow.dart
          - flavor: Barrio
            target: lib/main_barrio.dart
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Verify iOS schemes and plists
        run: |
          xcodebuild -list -project ios/Runner.xcodeproj
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/Firebase/GoogleService-Info-ForgeFlow.plist
          plutil -lint ios/Runner/Firebase/GoogleService-Info-Barrio.plist

      - name: Build iOS simulator app
        run: >
          flutter build ios
          --simulator
          --debug
          --flavor ${{ matrix.flavor }}
          -t ${{ matrix.target }}
          --dart-define=FORGE_FLOW_USE_FIREBASE_AUTH=true

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: RLS policy lint
        run: dart run tool/rls_policy_lint.dart

      - name: Test
        run: flutter test

  repo-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: postgres-import / index-leading-column / permission-key lints
        run: |
          dart run tool/postgres_import_lint.dart && \
          dart run tool/index_leading_column_lint.dart && \
          dart run tool/permission_key_lint.dart

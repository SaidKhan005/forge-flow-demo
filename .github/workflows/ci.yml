name: CI

# Cost discipline: GitHub Actions spending limit reached on 2026-05-12
# and the operator decided not to raise it. The cap blocks ALL runners
# (Linux included) until the free-tier minutes reset on 2026-06-01.
# Auto-triggering this workflow on every push/PR produces only red Xs
# in the meantime, so we gate it to manual dispatch until then.
#
# What's covered locally while CI is gated:
#   - Pre-push hook (`scripts/install_git_hooks.ps1`) runs the cheap
#     dart lints below (the `repo-lints` job).
#
# What's NOT covered locally — dispatch manually before merging
# high-risk slices:
#   - `flutter analyze --fatal-infos` (`analyze-and-test` job)
#   - `flutter test` (full unit suite)
#   - `flutter test --tags=postgres` (`postgres-tests` job —
#     integration tests against a real Postgres 16)
#
# Trigger from the Actions tab (`CI` → `Run workflow`) before merging
# anything that:
#   - changes db/migrations/**
#   - touches tool/advisor_proxy/**
#   - touches lib/services/ or lib/auth/
#   - changes the RLS policy posture
#
# **TODO 2026-06-01**: revert this gating block to restore auto-triggers
# once the free-tier minutes have reset. The pre-2026-05-13 form was:
#
#   on:
#     push:
#       branches: [master]
#     pull_request:
#       branches: [master]
on:
  workflow_dispatch:

# HARD-E — third-party actions pinned to commit SHA. Floating @v<n>
# refs are forbidden by `tool/actions_pinning_lint.dart` (see the
# `repo-lints` job below). The `# v<n>` trailing comment names the
# tag the pin originally satisfied so reviewers can scan upgrades at
# a glance. Tag → SHA mapping is verifiable with:
#
#   gh api repos/<org>/<repo>/git/ref/tags/<tag> --jq '.object.sha'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: RLS policy lint
        run: dart run tool/rls_policy_lint.dart

      - name: Test
        run: flutter test

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Postgres integration tests
        run: flutter test --tags=postgres
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/forgeflow_test

  repo-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: postgres-import / index-leading-column / permission-key / migration / release-dart-defines / actions-pinning / advisor-proxy-size lints
        run: |
          dart run tool/postgres_import_lint.dart && \
          dart run tool/index_leading_column_lint.dart && \
          dart run tool/permission_key_lint.dart && \
          dart run tool/migration_cutoff_lint.dart && \
          dart run tool/audit_logs_update_lint.dart && \
          dart run tool/migration_drift_scanner.dart --require-expand-contract && \
          dart run tool/release_dart_defines_lint.dart && \
          dart run tool/actions_pinning_lint.dart && \
          dart run tool/advisor_proxy_size_lint.dart

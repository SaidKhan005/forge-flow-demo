name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# HARD-E — third-party actions pinned to commit SHA. Floating @v<n>
# refs are forbidden by `tool/actions_pinning_lint.dart` (see the
# `repo-lints` job below). The `# v<n>` trailing comment names the
# tag the pin originally satisfied so reviewers can scan upgrades at
# a glance. Tag → SHA mapping is verifiable with:
#
#   gh api repos/<org>/<repo>/git/ref/tags/<tag> --jq '.object.sha'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: RLS policy lint
        run: dart run tool/rls_policy_lint.dart

      - name: Test
        run: flutter test

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Postgres integration tests
        run: flutter test --tags=postgres
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/forgeflow_test

  repo-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable

      - run: flutter pub get

      - name: postgres-import / index-leading-column / permission-key / migration-cutoff / release-dart-defines / actions-pinning lints
        run: |
          dart run tool/postgres_import_lint.dart && \
          dart run tool/index_leading_column_lint.dart && \
          dart run tool/permission_key_lint.dart && \
          dart run tool/migration_cutoff_lint.dart && \
          dart run tool/release_dart_defines_lint.dart && \
          dart run tool/actions_pinning_lint.dart

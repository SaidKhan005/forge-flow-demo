<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://*.firebaseapp.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    font-src 'self' data:;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com https://proxy.forgeflow.app https://*.forgeflow.app https://*.feflow.org;
    frame-src 'self' https://*.firebaseapp.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Forge & Flow</title>
  <style>
    :root {
      --background-deep: #f8ede6;
      --background-mid: #efe8e0;
      --background-surface: #ffffff;
      --card-glow: #f2ece4;
      --sunset: #cc7a3e;
      --sunset-dark: #9a5c2a;
      --text-primary: #2c2c2c;
      --text-secondary: #5a524a;
      --text-muted: #5e564e;
      --border-subtle: #ddd6cc;
      --negative: #c62828;
      --positive: #256b29;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-primary);
      font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: linear-gradient(
        180deg,
        var(--background-deep) 0%,
        var(--background-mid) 55%,
        #e8e2da 100%
      );
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .shell {
      width: min(100%, 400px);
    }

    .brand {
      display: grid;
      justify-items: center;
      gap: 16px;
      margin-bottom: 30px;
      text-align: center;
    }

    .brand img {
      width: 92px;
      height: 92px;
      border-radius: 999px;
      object-fit: cover;
      box-shadow: 0 8px 26px rgb(204 122 62 / 22%);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1.14;
      font-weight: 700;
    }

    .card {
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--background-surface), var(--card-glow));
      box-shadow: 0 10px 24px rgb(44 44 44 / 8%);
      padding: 22px 20px 20px;
    }

    .eyebrow {
      margin: 0 0 4px;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px;
      font-weight: 700;
    }

    .rule {
      width: 30px;
      height: 2px;
      margin-bottom: 18px;
      background: linear-gradient(90deg, var(--sunset), var(--sunset-dark));
    }

    .copy {
      margin: 0 0 16px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.45;
    }

    label {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      color: var(--text-secondary);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-primary);
      background: var(--background-surface);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--sunset);
      box-shadow: 0 0 0 3px rgb(204 122 62 / 16%);
    }

    button,
    .button-link {
      width: 100%;
      min-height: 46px;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: var(--sunset-dark);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.68;
    }

    .message {
      display: none;
      margin: 14px 0 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      background: var(--background-surface);
      font-size: 13px;
      line-height: 1.45;
    }

    .message[data-tone="error"] {
      display: block;
      border-color: rgb(198 40 40 / 35%);
    }

    .message[data-tone="success"] {
      display: block;
      border-color: rgb(37 107 41 / 35%);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="shell">
      <section class="brand" aria-label="Forge & Flow">
        <img src="/assets/images/forge_flow_splash_icon.png" alt="Forge & Flow logo">
        <h1>Forge & Flow</h1>
      </section>

      <section class="card" aria-live="polite">
        <p class="eyebrow">Reset password</p>
        <div class="rule" aria-hidden="true"></div>
        <p class="copy" id="intro">Checking your reset link.</p>

        <form id="reset-form" class="hidden" novalidate>
          <label>
            New password
            <input id="new-password" type="password" autocomplete="new-password" required>
          </label>
          <label>
            Confirm new password
            <input id="confirm-password" type="password" autocomplete="new-password" required>
          </label>
          <button id="submit-button" type="submit">Update password</button>
        </form>

        <p id="message" class="message"></p>
        <a id="continue-link" class="button-link hidden" href="forgeflow://sign-in">Back to sign in</a>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      checkActionCode,
      applyActionCode,
      verifyPasswordResetCode
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");
    const continueUrl = params.get("continueUrl");
    const defaultReturnUrl = "forgeflow://sign-in";
    const androidReturnUrl =
      "intent://sign-in#Intent;scheme=forgeflow;package=com.forgeflow.app;end";
    const intro = document.querySelector("#intro");
    const form = document.querySelector("#reset-form");
    const message = document.querySelector("#message");
    const submitButton = document.querySelector("#submit-button");
    const continueLink = document.querySelector("#continue-link");
    const newPassword = document.querySelector("#new-password");
    const confirmPassword = document.querySelector("#confirm-password");

    continueLink.addEventListener("click", (event) => {
      if (continueUrl) {
        return;
      }
      if (/Android/i.test(navigator.userAgent)) {
        event.preventDefault();
        window.location.href = androidReturnUrl;
      }
    });

    function showContinueLink() {
      continueLink.href = continueUrl || defaultReturnUrl;
      continueLink.classList.remove("hidden");
    }

    function showMessage(text, tone) {
      message.textContent = text;
      message.dataset.tone = tone;
    }

    function clearMessage() {
      message.textContent = "";
      message.removeAttribute("data-tone");
    }

    // Phase 9.UX.7 - stable Idempotency-Key for this confirm
    // attempt. The proxy requires the header on /confirm; a retry
    // of the same submit must reuse the same key so the cached
    // 200 replays instead of burning the (single-use) oobCode and
    // surfacing password_reset_expired. We hold the key on the
    // page and only regenerate it when the operator changes
    // either password input.
    function generateIdempotencyKey() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      const bytes = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(bytes);
      let hex = "";
      for (let i = 0; i < bytes.length; i += 1) {
        hex += bytes[i].toString(16).padStart(2, "0");
      }
      return hex;
    }
    let pendingIdempotencyKey = null;
    let lastIdempotencyInputs = "";

    function idempotencyKeyForInputs(inputs) {
      if (inputs !== lastIdempotencyInputs || !pendingIdempotencyKey) {
        pendingIdempotencyKey = generateIdempotencyKey();
        lastIdempotencyInputs = inputs;
      }
      return pendingIdempotencyKey;
    }

    function clearIdempotencyKey() {
      pendingIdempotencyKey = null;
      lastIdempotencyInputs = "";
    }

    function validationMessage(candidate, confirmation) {
      if (!candidate || !confirmation) {
        return "All fields are required.";
      }
      if (candidate !== confirmation) {
        return "Passwords do not match.";
      }
      const messages = [];
      if (candidate.length < 8) {
        messages.push("Use at least 8 characters.");
      }
      if (candidate.length > 256) {
        messages.push("Use 256 characters or fewer.");
      }
      if (/[\u0000-\u001f\u007f]/.test(candidate)) {
        messages.push("Remove tabs, line breaks, or control characters.");
      }
      if (candidate.trim() !== candidate) {
        messages.push("Remove spaces at the beginning or end.");
      }
      return messages.join(" ");
    }

    function resetFailureMessage(body) {
      const rejections = Array.isArray(body && body.rejections)
        ? body.rejections
        : [];
      if (rejections.includes("pwned_in_breach")) {
        return "This password has appeared in known breaches; please choose another.";
      }
      if (rejections.includes("reused_from_history")) {
        return "You can't reuse a recent password.";
      }
      if (rejections.includes("violates_policy")) {
        return body.message || "Choose a password that meets the password policy.";
      }
      return body.message || "Password could not be updated. Request a new reset link and try again.";
    }

    async function loadFirebaseConfig() {
      const response = await fetch("/firebase-config.js", {
        cache: "no-store",
        credentials: "same-origin"
      });
      if (!response.ok) {
        throw new Error("config unavailable");
      }
      return response.json();
    }

    async function boot() {
      if (!oobCode) {
        intro.textContent = "This link has expired.";
        showMessage(
          "Reset links expire after a short time. Open Forge & Flow and tap Forgot password? to get a fresh one.",
          "error"
        );
        showContinueLink();
        return;
      }

      try {
        const firebaseConfig = await loadFirebaseConfig();
        const proxyBaseUri = firebaseConfig.proxyBaseUri || window.FORGE_FLOW_PROXY_BASE_URI || "";
        if (!proxyBaseUri) {
          intro.textContent = "Password reset is not configured.";
          showMessage(
            "This action page is missing its proxy configuration. Request a fresh link after staging is updated.",
            "error"
          );
          showContinueLink();
          return;
        }
        const resetConfirmUrl = new URL(
          "/v1/auth/password/reset/confirm",
          proxyBaseUri
        ).toString();
        const { proxyBaseUri: _proxyBaseUri, ...firebaseOptions } = firebaseConfig;
        const app = initializeApp(firebaseOptions);
        const auth = getAuth(app);
        if (mode === "verifyEmail") {
          await applyActionCode(auth, oobCode);
          intro.textContent = "Email verified.";
          showMessage("Your email address has been verified. You can return to the app.", "success");
          showContinueLink();
          return;
        }

        if (mode === "recoverEmail") {
          await checkActionCode(auth, oobCode);
          await applyActionCode(auth, oobCode);
          intro.textContent = "Email change recovered.";
          showMessage("Your sign-in email has been restored. You can return to the app.", "success");
          showContinueLink();
          return;
        }

        if (mode !== "resetPassword") {
          intro.textContent = "This account action link is not supported.";
          showMessage(
            "Open Forge & Flow and tap Forgot password? to get a fresh one.",
            "error"
          );
          showContinueLink();
          return;
        }

        // Phase 9.UX.7 - hand mobile clients off to the in-app
        // confirm screen via the `forgeflow://reset-password?...`
        // deep link. The PasswordResetDeepLinkHandler in the app
        // pushes PasswordResetConfirmScreen with the oobCode parsed
        // from the URI. If the app is not installed (or the deep
        // link does not resolve within ~1.2s) the page falls back
        // to the web form so operators on devices without the app
        // can still complete the reset in the browser.
        const isMobile = /Android|iPhone|iPad|iPod/i.test(
          navigator.userAgent
        );
        const deepLinkAttempted = sessionStorage.getItem(
          "forgeflow.resetPassword.deeplinkTried"
        );
        if (isMobile && !deepLinkAttempted) {
          sessionStorage.setItem(
            "forgeflow.resetPassword.deeplinkTried",
            "1"
          );
          intro.textContent = "Opening Forge & Flow…";
          showMessage(
            "If the app does not open, you can finish the reset on this page below.",
            "success"
          );
          const deepLink =
            "forgeflow://reset-password?mode=resetPassword&oobCode=" +
            encodeURIComponent(oobCode);
          window.location.href = deepLink;
          await new Promise((resolve) => setTimeout(resolve, 1200));
          if (document.hidden) {
            // The OS handed control to the app; leave the web page
            // idle so it does not race a successful in-app confirm.
            return;
          }
          intro.textContent =
            "Forge & Flow did not open. Finish your reset here instead.";
          clearMessage();
        }

        await verifyPasswordResetCode(auth, oobCode);
        intro.textContent = "Enter a new password that meets the same rules used in the app.";
        form.classList.remove("hidden");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          clearMessage();
          const rejection = validationMessage(newPassword.value, confirmPassword.value);
          if (rejection) {
            showMessage(rejection, "error");
            return;
          }

          submitButton.disabled = true;
          submitButton.textContent = "Updating password";
          // Stable Idempotency-Key per (oobCode, password) attempt.
          // A network-retry of the same submit reuses the key and
          // replays the cached 200 instead of re-burning the oobCode.
          const idempotencyKey = idempotencyKeyForInputs(
            oobCode + "|" + newPassword.value
          );
          try {
            const response = await fetch(resetConfirmUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Idempotency-Key": idempotencyKey
              },
              body: JSON.stringify({
                oob_code: oobCode,
                new_password: newPassword.value
              })
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              // Policy / oobCode rejections are terminal - let the
              // operator pick a new password (which will rotate the
              // idempotency key on next submit because the password
              // input changes).
              if (response.status >= 400 && response.status < 500) {
                clearIdempotencyKey();
              }
              showMessage(resetFailureMessage(body), "error");
              return;
            }
            clearIdempotencyKey();
            form.classList.add("hidden");
            intro.textContent = "Password updated.";
            showMessage("Password updated. Please sign in.", "success");
            showContinueLink();
          } catch (_) {
            // Network/transport failure - keep the key so a retry
            // of the same submit replays the cached response.
            showMessage("Password could not be updated. Request a new reset link and try again.", "error");
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Update password";
          }
        });
      } catch (_) {
        intro.textContent = "This link has expired.";
        showMessage(
          "Reset links expire after a short time. Open Forge & Flow and tap Forgot password? to get a fresh one.",
          "error"
        );
        showContinueLink();
      }
    }

    boot();
  </script>
</body>
</html>

<!DOCTYPE html><html><head>
  <!--
    Phase 11W.0 - Operator Web Console index shell.

    Distinct from `web/index.html` (the operator-app web shell which
    Phase 11A.0 reused as the F&F Operations Console). The operator
    web build target reads from `web/operator/` so the brand title and
    description match the customer-facing Operator Web Console rather
    than the F&F internal Operations Console.

    `--web-resources-dir=web/operator` on the `flutter build web`
    invocation tells Flutter to copy this directory in alongside the
    compiled bundle.

    The `<base href>` value is rewritten by `flutter build` per the
    `--base-href` argument. The Cloud Run nginx config in
    `Dockerfile.operator_web` falls back to `/index.html` for any
    unknown path so client-side routes (e.g.
    `/onboarding/welcome?token=...`) still hit the SPA bundle.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://*.firebaseapp.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self' https://fonts.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com https://proxy.forgeflow.app https://*.forgeflow.app https://*.run.app;
    frame-src 'self' https://*.firebaseapp.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Forge &amp; Flow Operator Web Console - manage account, vendor connections, and onboarding for your business.">
  <!-- A7: no-referrer policy prevents magic-link tokens embedded in the
       URL from leaking via Referer headers to third-party resources
       (fonts, analytics, images) loaded by this page. -->
  <meta name="referrer" content="no-referrer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Forge &amp; Flow">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=forge-flow-20260507">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=forge-flow-20260507">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=forge-flow-20260507">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=forge-flow-20260507">

  <title>Forge &amp; Flow - Operator Web Console</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #F8EDE6;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script type="module" src="forge_flow_web_bootstrap.js"></script>


</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forge &amp; Flow</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f1ec;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        color: #1f1d1a;
      }
      .ff-container {
        max-width: 560px;
        margin: 24px auto;
        background-color: #ffffff;
        border: 1px solid #e6e1d8;
        border-radius: 8px;
        overflow: hidden;
      }
      .ff-header {
        background-color: #c44b1f;
        color: #ffffff;
        padding: 18px 24px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .ff-body {
        padding: 24px;
        font-size: 15px;
        line-height: 1.55;
      }
      .ff-body h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px 0;
      }
      .ff-body h2 {
        font-size: 16px;
        font-weight: 700;
        margin: 18px 0 8px 0;
      }
      .ff-body p {
        margin: 0 0 12px 0;
      }
      .ff-body ul {
        margin: 0 0 12px 0;
        padding-left: 22px;
      }
      .ff-body li {
        margin: 0 0 4px 0;
      }
      .ff-body a {
        color: #c44b1f;
        text-decoration: underline;
      }
      .ff-footer {
        background-color: #f9f6f1;
        border-top: 1px solid #e6e1d8;
        padding: 14px 24px;
        font-size: 12px;
        color: #6b6863;
      }
      .ff-footer a {
        color: #6b6863;
      }
    </style>
  </head>
  <body>
    <div class="ff-container">
      <div class="ff-header">Forge &amp; Flow</div>
      <div class="ff-body">
        {{body}}
      </div>
      <div class="ff-footer">
        You are receiving this email because of activity on your Forge &amp; Flow
        account. If this looks unexpected, reply to this email and the F&amp;F
        team will investigate.
      </div>
    </div>
  </body>
</html>
